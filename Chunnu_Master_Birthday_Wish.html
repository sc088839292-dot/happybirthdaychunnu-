<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#180d2e"><title>जन्मदिन मुबारक हो, चुन्नू मास्टर!</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#48245d,#1b1030 55%,#10091e);color:#fff3e5;font-family:system-ui,"Noto Sans Devanagari",sans-serif;overflow-x:hidden}.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:28px 16px}.wrap{max-width:850px;margin:auto;width:100%}.tag{display:inline-block;border:1px solid #ffd77888;border-radius:30px;padding:7px 15px;color:#ffd778}h1{font-size:clamp(2.5rem,10vw,5.8rem);line-height:1.12;color:#ffd778;margin:18px 0;text-shadow:0 5px 30px #ffbd5c55}.name{font-size:clamp(2rem,8vw,4rem);font-weight:900;margin:8px;color:#fff0f7}.cake{font-size:clamp(5rem,20vw,8rem);animation:bob 3s infinite ease-in-out}@keyframes bob{50%{transform:translateY(-12px)}}p{line-height:1.9}.subtitle{font-size:1.2rem;color:#f7ddec}.btn{border:0;border-radius:30px;padding:13px 21px;margin:7px;font-size:1rem;font-weight:bold;background:linear-gradient(100deg,#ffe6a1,#ff9dc8);color:#29112f}.secondary{background:#ffffff18;color:white;border:1px solid #ffffff66}.panel{max-width:820px;margin:auto;background:#ffffff0d;border:1px solid #ffffff25;border-radius:23px;padding:clamp(20px,5vw,40px)}section{padding:48px 16px}h2{text-align:center;color:#ffd778;font-size:clamp(1.7rem,6vw,2.5rem)}.message{text-align:center;font-size:clamp(1.05rem,3.5vw,1.22rem);line-height:2}.message strong{color:#ffd98d}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#ffffff0e;border:1px solid #ffffff22;border-radius:16px;padding:18px;text-align:center;line-height:1.8}.card b{display:block;color:#ffd98d;margin-bottom:6px}.wish{text-align:center;font-size:1.4rem;line-height:1.9;color:#ffe7b5}footer{text-align:center;padding:25px;color:#d7bedf}#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
